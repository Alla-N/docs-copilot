[project]
name = "copilot-agent"
version = "0.1.0"
description = "Python agent service for docs-copilot: retrieval now, the LangGraph orchestrator next"
readme = "README.md"
authors = [
    { email = "allasandra1725@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "openai>=3.13.0",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused imports, undefined names
    "I",       # import sorting
    "UP",      # pyupgrade: modern syntax for the target version
    "B",       # bugbear: likely bugs
    "SIM",     # simplifications
    "ASYNC",   # blocking calls inside async functions
    "RUF",     # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -m "not integration" by default: a plain `uv run pytest` never spends money or needs secrets.
# `uv run pytest -m integration` overrides it (the last -m wins) to run only the live tests.
addopts = ["-ra", "--strict-markers", "--import-mode=importlib", "-m", "not integration"]
markers = [
    "integration: needs network and secrets (Supabase, OpenAI, Cohere); excluded from the pre-commit hook",
]
